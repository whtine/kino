services:
  - type: web
    name: vk-moderation-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: VK_TOKEN
        sync: false
      - key: GROUP_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ACTIVATION_COMMAND
        value: /activate
      - key: MAX_MENTIONS_PER_ZOV
        value: "100"
